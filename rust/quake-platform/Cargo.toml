[package]
name = "quake-platform"
version = "0.1.0"
description = "SDL2+SDL3 platform glue, input, video, sys/pl layers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sdl3 = { version = "0.18.4", optional = true }
# Phase 9 M1 (ADR-003, ADR-017): the SDL2 arm of the platform layer; raw
# `sdl2::sys` bindings only, no bundled build -- the Linux SDL2 CI legs link
# the distro library exactly as the C files do
sdl2 = { version = "0.38", optional = true, default-features = false }
quake-c-sys = { path = "../quake-c-sys" }
quake-types = { path = "../quake-types" }
# Phase 9 M7 (ADR-009): `HostError`, the typed `Host_Guard` outcome the
# host loop in `main_sdl` consumes
quake-host = { path = "../quake-host" }

# ADR-003 (Phase 9 M1 amendment, adopted M4): pl_win.c's icon, clipboard
# and error-dialog calls, feature by feature as each milestone needs them;
# M5 adds the sys_sdl_win.c set (wide file API, registry / known folders /
# shell, dedicated console, DbgHelp stack traces, thread affinity)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# ADR-003 (Phase 9 M5): sys_sdl_unix.c's POSIX calls (stat, fork/exec,
# getpwuid, select/read, backtrace, sysctl, pthread affinity); MIT/Apache-2.0
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
sdl3 = ["dep:sdl3"]
sdl2 = ["dep:sdl2"]
# Phase 9: the platform layer proper (input, pl, sys, main); each module
# lands under this feature at its milestone
platform = []
# Phase 9 M5: `DO_USERDIRS` (sys_sdl_unix.c's ~/.vkqr-engine userdir); the
# Meson `do_userdirs` option forwards it
userdirs = []
# Phase 9 M6: `_DEBUG` (main_sdl.c's SDL debug log priority); the Meson
# debug buildtypes forward it
engine-debug = []
