# Fuzzing workspace (Phase 2 exit criterion: fuzzers live for pak/wad/kpf
# inputs). Deliberately its own workspace, NOT a member of ../Cargo.toml:
# the root workspace sets panic = "abort" in every profile (ADR-009), but
# libFuzzer needs unwinding to catch panics, so the fuzz crates must keep
# the default panic = "unwind".
[package]
name = "quake-fuzz"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-2.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
quake-fs = { path = "../quake-fs" }
quake-util = { path = "../quake-util" }
quake-types = { path = "../quake-types" }
# Phase 3 M7 (D11): the model/image accept-reject decision layer. These are
# the pure predicates the model_parse/image_decode shims are built on, so
# fuzzing them fuzzes the Rust engine's real decisions. The true C-via-FFI
# differential over real and malformed assets is the quake-ctest suites and
# the formats_corpus gate, which compile the c_ref archive; keeping it out of
# libFuzzer avoids the C parsers' documented out-of-domain UB (over-reads on
# truncated model files) turning into false crashes in the fuzz loop.
quake-formats = { path = "../quake-formats" }
quake-image = { path = "../quake-image" }
quake-snd = { path = "../quake-snd" }
# Phase 5: the wire-layer reader/writer core the net capi shims are built on
quake-net = { path = "../quake-net" }

# Empty table: this package is its own workspace root, so the parent
# workspace at rust/Cargo.toml (which also lists it in `exclude`) never
# tries to own it.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_pak"
path = "fuzz_targets/fuzz_pak.rs"
test = false
doc = false
bench = false

