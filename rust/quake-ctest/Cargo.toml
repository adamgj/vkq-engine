[package]
name = "quake-ctest"
version = "0.1.0"
description = "dev-only differential test harness: Rust ports vs the original C, compiled via cc; never linked into the shipping staticlib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quake-util = { path = "../quake-util" }
quake-math = { path = "../quake-math" }
quake-types = { path = "../quake-types" }
quake-snd = { path = "../quake-snd" }
quake-net = { path = "../quake-net" }
# Phase 6 M2: the arena/string-table differentials drive quake-progs directly
# (it is deliberately quake-c-sys-free, so there are no capi shims yet)
quake-progs = { path = "../quake-progs" }
quake-c-sys = { path = "../quake-c-sys" }
# Phase 2: the differential suites compare the fs shims against the c_ref_*
# build of common_fs.c/steam.c, so the fs feature must be on
quake-capi = { path = "../quake-capi", features = ["fs", "image", "formats", "snd", "net", "codec-wave", "codec-mp3", "codec-umx"] }
quake-fs = { path = "../quake-fs" }
# Phase 3 M6: threaded_parse asserts the pure parsers' outputs are Send/Sync
# (ADR-016), so it needs the crates directly, not just through quake-capi
quake-formats = { path = "../quake-formats" }
quake-image = { path = "../quake-image" }

[dev-dependencies]
# ADR-003 review: proptest is MIT OR Apache-2.0 (MIT preferred), dev-only;
# transitive graph checked with `cargo deny check licenses`
proptest = "1"
# already in the workspace graph via quake-fs (ADR-012); tests use it to
# deflate synthetic QuakeEX.kpf entries
miniz_oxide = "0.8"

[build-dependencies]
# ADR-003 review: cc is MIT OR Apache-2.0 (MIT preferred), build-time only
cc = "1"
# compresses the synthetic embedded vkquake.pak baked into the c_ref build
# (the real embedded_pak.c is generated by Meson at build time, not in git)
miniz_oxide = "0.8"

[lints]
workspace = true
