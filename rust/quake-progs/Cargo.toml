[package]
name = "quake-progs"
version = "0.1.0"
description = "QCVM: loader, edict arena, interpreter, ED_Write/Parse, builtins"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quake-types = { path = "../quake-types" }
quake-util = { path = "../quake-util" }

[features]
# mirrors the C build's DEBUG/_DEBUG (Meson sets it for debug buildtypes);
# edict_t's layout forks on it, so it must reach quake-types
engine-debug = ["quake-types/engine-debug"]

[lints]
workspace = true
