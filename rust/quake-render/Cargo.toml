[package]
name = "quake-render"
version = "0.1.0"
description = "ash renderer: gl_heap suballocator, texmgr, pipelines, frame graph"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quake-types = { path = "../quake-types", features = ["render"] }
# Phase 8 M3 (ADR-003, ADR-015): the Vulkan binding. No default features --
# no `loaded` (the engine loads Vulkan through SDL, so no libloading) -- so
# ash reaches the staticlib with zero runtime transitives. "MIT OR
# Apache-2.0", taken as MIT.
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }

[lints]
workspace = true
