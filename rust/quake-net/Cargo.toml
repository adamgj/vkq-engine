[package]
name = "quake-net"
version = "0.1.0"
description = "MSG_* readers/writers, protocols 15/666/999+PRFL+PEXT, net drivers, demo IO"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quake-types = { path = "../quake-types" }

# ADR-003 (Phase 5 M1 amendment, adopted M7): the UDP landriver's socket
# layer ("MIT OR Apache-2.0" -> MIT) and the unix resolution/ioctl calls
# socket2 does not expose. The net_udp.c arm of `udp::sys`.
[target.'cfg(unix)'.dependencies]
socket2 = "0.6"
libc = "0.2"

# ADR-003 (Phase 9 M1 amendment, adopted M2): the net_wins.c arm of
# `udp::sys` calls the same ws2_32 entry points the C driver did (socket2
# would route socket creation through WSASocketW and hide the WSAStartup /
# WSACleanup refcount the driver reproduces), so it stays windows-sys only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[features]
# mirrors the C build's DEBUG/_DEBUG (Meson sets it for debug buildtypes):
# the MSG_Write{Char,Byte,Short} range Host_Errors exist only there
engine-debug = []

[lints]
workspace = true
