# cbindgen config for the quake_rs.h header (ADR-011).
# The header is generated into the Meson build dir by scripts/cargo_build.py;
# it must stay declaration-compatible with the original engine headers
# (enforced by scripts/harness/check_capi_signatures.sh).

language = "C"
include_guard = "QUAKE_RS_H"
cpp_compat = true
usize_is_size_t = true
documentation = false
header = """/* Generated by cbindgen from rust/quake-capi -- do not edit.
 * Declarations here must remain compatible with the engine headers the C
 * callers still include (crc.h, strl_fn.h, mathlib.h, ...). */"""

# hand-written declarations for shims cbindgen cannot express in the exact
# shape the engine headers use (struct tags, pointer-to-array parameters);
# kept declaration-compatible by check_capi_signatures.sh like the rest
# mathlib declarations are all hand-written: the C prototypes use array
# parameters (vec3_t = float[3]), and GCC's -Warray-parameter (fatal under
# werror) rejects cbindgen's pointer-typed redeclarations against mathlib.h
after_includes = """
#ifdef __cplusplus
extern "C" {
#endif
struct mplane_s;
int BoxOnPlaneSide(float emins[3], float emaxs[3], struct mplane_s *p);
void R_ConcatRotations(float in1[3][3], float in2[3][3], float out[3][3]);
void R_ConcatTransforms(float in1[3][4], float in2[3][4], float out[3][4]);
extern float vec3_origin[3];
void VectorAngles(const float forward[3], float *up, float angles[3]);
void VectorMA(const float veca[3], float scale, const float vecb[3], float vecc[3]);
float _DotProduct(const float v1[3], const float v2[3]);
void _VectorSubtract(const float veca[3], const float vecb[3], float out[3]);
void _VectorAdd(const float veca[3], const float vecb[3], float out[3]);
void _VectorCopy(const float in[3], float out[3]);
int VectorCompare(const float v1[3], const float v2[3]);
float VectorLength(const float v[3]);
void CrossProduct(const float v1[3], const float v2[3], float cross[3]);
float VectorNormalize(float v[3]);
void VectorInverse(float v[3]);
void VectorScale(const float in[3], float scale, float out[3]);
void RotatePointAroundVector(float dst[3], const float dir[3], const float point[3], float degrees);
void PerpendicularVector(float dst[3], const float src[3]);
void FloorDivMod(double numer, double denom, int *quotient, int *rem);
int Invert24To16(int val);
int GreatestCommonDivisor(int i1, int i2);
void AngleVectors(float angles[3], float forward[3], float right[3], float up[3]);
float anglemod(float a);
void MatrixMultiply(float left[16], float right[16]);
void RotationMatrix(float matrix[16], float angle, float x, float y, float z);
void TranslationMatrix(float matrix[16], float x, float y, float z);
void ScaleMatrix(float matrix[16], float x, float y, float z);
void IdentityMatrix(float matrix[16]);
bool IsAxisAlignedDeg(const float angle[3]);
bool IsOriginWithinMinMax(const float origin[3], const float mins[3], const float maxs[3]);
struct hash_map_s;
struct hash_map_s *HashMap_CreateImpl(uint32_t key_size, uint32_t value_size, uint32_t (*hasher)(const void *), bool (*comp)(const void *, const void *));
void HashMap_Destroy(struct hash_map_s *map);
void HashMap_Reserve(struct hash_map_s *map, int capacity);
void HashMap_Clear(struct hash_map_s *map);
bool HashMap_InsertImpl(struct hash_map_s *map, uint32_t key_size, uint32_t value_size, const void *key, const void *value);
bool HashMap_EraseImpl(struct hash_map_s *map, uint32_t key_size, const void *key);
void *HashMap_LookupImpl(struct hash_map_s *map, uint32_t key_size, const void *key);
uint32_t HashMap_Size(struct hash_map_s *map);
void *HashMap_GetKeyImpl(struct hash_map_s *map, uint32_t index);
void *HashMap_GetValueImpl(struct hash_map_s *map, uint32_t index);
struct json_s;
struct json_s *JSON_Parse(const char *text);
void JSON_Free(struct json_s *json);
/* The wad and JSON_Find surfaces need the engine typedefs (lumpinfo_t, qpic_t,
 * wad_t, jsonentry_t are anonymous typedefs with no struct tag), so they are
 * guarded on the engine headers' include guards: when a TU includes both, the
 * compiler diffs these against the originals -- which is exactly what the
 * signature gate compiles. */
#ifdef _QUAKE_WAD_H
extern int wad_numlumps;
extern lumpinfo_t *wad_lumps;
extern byte *wad_base;
void W_LoadWadFile(void);
void W_CleanupName(const char *in, char *out);
void *W_GetLumpName(const char *name, lumpinfo_t **out_info);
wad_t *W_LoadWadList(const char *names);
void W_FreeWadList(wad_t *wads);
lumpinfo_t *W_GetLumpinfoList(wad_t *wads, const char *name, wad_t **out_wad);
void SwapPic(qpic_t *pic);
#endif
#ifdef _JSON_H_
const jsonentry_t *JSON_Find(const jsonentry_t *entry, const char *name, jsontype_t type);
const char *JSON_FindString(const jsonentry_t *entry, const char *name);
const double *JSON_FindNumber(const jsonentry_t *entry, const char *name);
const qboolean *JSON_FindBoolean(const jsonentry_t *entry, const char *name);
#endif
/* The brush/BSP loader seam (model_parse.h) and the two gl_model.c internals
 * the shims call back into are typed with the engine's
 * qmodel_t/lump_t/msurface_t/texture_t/wad_t typedefs, so they are guarded on
 * gl_model.h's include guard; the signature gate compiles a TU with both. */
#ifdef __MODEL__
byte *Mod_DecompressVis(byte *in, qmodel_t *model);
void Mod_ParseTextures(qmodel_t *mod, byte *mod_base, lump_t *l, wad_t *wads);
void Mod_LoadLighting(qmodel_t *mod, byte *mod_base, lump_t *l);
void Mod_LoadVisibility(qmodel_t *mod, byte *mod_base, lump_t *l);
void Mod_LoadEntities(qmodel_t *mod, byte *mod_base, lump_t *l);
void Mod_LoadVertexes(qmodel_t *mod, byte *mod_base, lump_t *l);
void Mod_LoadEdges(qmodel_t *mod, byte *mod_base, lump_t *l, int bsp2);
void Mod_LoadTexinfo(qmodel_t *mod, byte *mod_base, lump_t *l);
void CalcSurfaceExtents(qmodel_t *mod, msurface_t *s);
void Mod_ParseFaces(qmodel_t *mod, byte *mod_base, lump_t *l, qboolean bsp2);
void Mod_LoadNodes(qmodel_t *mod, byte *mod_base, lump_t *l, int bsp2);
void Mod_MakeHull0(qmodel_t *mod);
void Mod_LoadSurfedges(qmodel_t *mod, byte *mod_base, lump_t *l);
void Mod_LoadPlanes(qmodel_t *mod, byte *mod_base, lump_t *l);
void Mod_LoadSubmodels(qmodel_t *mod, byte *mod_base, lump_t *l);
FILE *Mod_FindVisibilityExternal(qmodel_t *mod, const char *loadname);
byte *Mod_LoadVisibilityExternal(FILE *f);
/* Phase 3 M4: the MDL/SPR half of the same seam. Neither takes a buffer
 * length -- gl_model.c has none to give -- so both walk the file image raw,
 * exactly like the C. */
aliashdr_t *Mod_ParseAliasModel(qmodel_t *mod, void *buffer);
void Mod_CalcAliasBounds(qmodel_t *mod, aliashdr_t *a, int numvertexes, byte *vertexes);
void Mod_LoadSpriteModel(qmodel_t *mod, void *buffer);
/* Phase 3 M5: the MD3/MD5 half. Same no-length seam; both call back into
 * gl_model.c for the .skin plumbing and into gl_mesh.c for the GPU upload. */
void Mod_LoadMD3Model(qmodel_t *mod, const void *buffer);
qboolean Mod_LoadMD5MeshModel(qmodel_t *mod, const void *buffer);
/* Host_Error trampolines: the Rust side returns the message C would have
 * raised and Quake/model_parse_glue.c re-raises it from a C frame (PLAN.md
 * 4.3 -- a longjmp must never unwind a Rust frame) */
int quake_rs_mod_load_leafs(qmodel_t *mod, byte *mod_base, lump_t *l, int bsp2, char *err);
int quake_rs_mod_load_clipnodes(qmodel_t *mod, byte *mod_base, lump_t *l, qboolean bsp2, char *err);
int quake_rs_mod_load_marksurfaces(qmodel_t *mod, byte *mod_base, lump_t *l, int bsp2, char *err);
int quake_rs_mod_setup_submodels(qmodel_t *mod, const char *sv_modelname, char *err);
int quake_rs_mod_load_leafs_external(qmodel_t *mod, FILE *f, char *err);
/* called by the Rust shims; these stay in gl_model.c */
qmodel_t *Mod_FindName(const char *name);
texture_t *Mod_LoadWadTexture(qmodel_t *mod, wad_t *wads, const char *name);
void *Mod_LoadAllSkins(aliashdr_t *pheader, qmodel_t *mod, byte *mod_base, int numskins, byte *pskintype);
size_t Mod_LoadMD5SurfaceSkins(qmodel_t *mod, aliashdr_t *surf, int surf_index, size_t numsurfaces, const char *shader_name);
void Mod_LoadMD3SkinDefinitions(qmodel_t *mod, all_surfaces_def_t *surf_defs);
int Mod_LoadMD3SurfaceSkins(
	qmodel_t *mod, aliashdr_t *surf, all_surfaces_def_t *surfaces_def, const char *surface_name, int surface_index, size_t numsurfs, size_t numskins);
/* Mod_SetExtraFlags stays in model_parse.c (r_nolerp_list + particle script) */
void Mod_SetExtraFlags(qmodel_t *mod);
/* the alias scratch arrays keep C linkage -- gl_mesh.c reads all three after
 * the load -- so only the two file-static cursors moved to Rust */
extern stvert_t stverts[MAXALIASVERTS];
extern mtriangle_t *triangles;
extern trivertx_t *poseverts[MAXALIASFRAMES];
/* gl_texmgr.h cannot be reached from every consumer of this header (it pulls
 * Vulkan and SDL in), so this one is guarded on that header's own guard */
#ifdef _GL_TEXMAN_H
gltexture_t *TexMgr_LoadImage(
	qmodel_t *owner, const char *name, int width, int height, enum srcformat format, byte *data, const char *source_file, src_offset_t source_offset,
	unsigned flags);
#endif
/* likewise glquake.h, for the MD3/MD5 mesh upload the Rust loaders call */
#ifdef GLQUAKE_H
void GLMesh_UploadBuffers(qmodel_t *mod, aliashdr_t *hdr, unsigned short *indexes, byte *vertexes, aliasmesh_t *desc, jointpose_t *joints);
void GLMesh_DeleteMeshBuffers(aliashdr_t *mainhdr);
#endif
#endif
/* the searchpath heads use the engine's searchpath_t typedef (Rust mirror:
 * quake_types::fs::SearchPath), so they are guarded on common.h */
#ifdef Q_COMMON_H
extern searchpath_t *com_searchpaths;
extern searchpath_t *com_base_searchpaths;
/* Phase 5 M3: the MSG/SZ wire layer. Reader entry points and SZ_Clear have
 * no error paths and are exported under their exact common.h names; writers
 * and the erroring SZ functions are quake_rs_* status trampolines that
 * Quake/net_msg_glue.c re-raises from a C frame (ADR-009). Declared by hand
 * so the signatures match common.h exactly (int vs int32_t etc.). */
void MSG_BeginReading(void);
int MSG_ReadChar(void);
int MSG_ReadByte(void);
int MSG_ReadShort(void);
int MSG_ReadLong(void);
unsigned long long MSG_ReadUInt64(void);
long long MSG_ReadInt64(void);
float MSG_ReadFloat(void);
float MSG_ReadDouble(void);
const char *MSG_ReadString(void);
float MSG_ReadCoord(unsigned int flags);
float MSG_ReadAngle(unsigned int flags);
float MSG_ReadAngle16(unsigned int flags);
unsigned int MSG_ReadEntity(unsigned int pext2);
void SZ_Clear(sizebuf_t *buf);
int quake_rs_msg_write_char(sizebuf_t *sb, int c);
int quake_rs_msg_write_byte(sizebuf_t *sb, int c);
int quake_rs_msg_write_short(sizebuf_t *sb, int c);
int quake_rs_msg_write_long(sizebuf_t *sb, int c);
int quake_rs_msg_write_uint64(sizebuf_t *sb, unsigned long long c);
int quake_rs_msg_write_int64(sizebuf_t *sb, long long c);
int quake_rs_msg_write_float(sizebuf_t *sb, float f);
int quake_rs_msg_write_double(sizebuf_t *sb, double f);
int quake_rs_msg_write_string(sizebuf_t *sb, const char *s);
int quake_rs_msg_write_string_unterminated(sizebuf_t *sb, const char *s);
int quake_rs_msg_write_coord(sizebuf_t *sb, float f, unsigned int flags);
int quake_rs_msg_write_angle(sizebuf_t *sb, float f, unsigned int flags);
int quake_rs_msg_write_angle16(sizebuf_t *sb, float f, unsigned int flags);
int quake_rs_msg_write_entity(sizebuf_t *sb, unsigned int entnum, unsigned int pext2);
int quake_rs_sz_get_space(sizebuf_t *buf, int length, int *offset);
int quake_rs_sz_write(sizebuf_t *buf, const void *data, int length);
int quake_rs_sz_print(sizebuf_t *buf, const char *data);
/* Phase 5 M4: demo file format (cl_demo.c keeps the raw stdio) */
void quake_rs_demo_record_header(int cursize, const float *viewangles, unsigned char *out16);
int quake_rs_demo_parse_record_header(const unsigned char *header, int *cursize, float *viewangles);
int quake_rs_demo_forcetrack_line(int track, char *out, int outsize);
int quake_rs_demo_parse_forcetrack(const char *buf, int len, int *track, int *consumed);
long long quake_rs_demo_resume_seek_offset(void);
#endif
/* Phase 5 M5: the Rust loopback driver, installed into net_drivers[0] by
 * net_bsd.c/net_win.c under USE_RUST_NET (Loop_SearchForHosts stays C until
 * M9). Guarded on net_defs.h's own guard for the qsocket_t typedef. */
#ifdef __NET_DEFS_H
int rust_loop_Init(void);
void rust_loop_Shutdown(void);
void rust_loop_Listen(qboolean state);
qsocket_t *rust_loop_Connect(const char *host);
qsocket_t *rust_loop_CheckNewConnections(void);
qsocket_t *rust_loop_GetAnyMessage(void);
int rust_loop_GetMessage(qsocket_t *sock);
int rust_loop_SendMessage(qsocket_t *sock, sizebuf_t *data);
int rust_loop_SendUnreliableMessage(qsocket_t *sock, sizebuf_t *data);
qboolean rust_loop_CanSendMessage(qsocket_t *sock);
qboolean rust_loop_CanSendUnreliableMessage(qsocket_t *sock);
void rust_loop_Close(qsocket_t *sock);
#endif
#ifdef __cplusplus
} /* extern "C" -- these hand-written declarations sit outside cbindgen's own
   * cpp_compat guard, so they carry their own */
#endif"""

[parse]
parse_deps = false

[export]
exclude = [
    "BoxOnPlaneSide", "R_ConcatRotations", "R_ConcatTransforms", "vec3_origin",
    "VectorAngles", "VectorMA", "_DotProduct", "_VectorSubtract", "_VectorAdd",
    "_VectorCopy", "VectorCompare", "VectorLength", "CrossProduct",
    "VectorNormalize", "VectorInverse", "VectorScale", "RotatePointAroundVector",
    "PerpendicularVector", "FloorDivMod", "Invert24To16", "GreatestCommonDivisor",
    "AngleVectors", "anglemod", "MatrixMultiply", "RotationMatrix",
    "TranslationMatrix", "ScaleMatrix", "IdentityMatrix", "IsAxisAlignedDeg",
    "IsOriginWithinMinMax",
    "HashMap_CreateImpl", "HashMap_Destroy", "HashMap_Reserve", "HashMap_Clear",
