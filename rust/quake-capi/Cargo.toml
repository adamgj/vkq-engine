[package]
name = "quake-capi"
version = "0.1.0"
description = "cbindgen-exported C ABI shims; builds the libquake_rs staticlib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "quake_rs"
# rlib in addition to staticlib so quake-ctest can link the shims into its
# differential test binaries
crate-type = ["staticlib", "rlib"]

[dependencies]
quake-util = { path = "../quake-util" }

[lints]
workspace = true
