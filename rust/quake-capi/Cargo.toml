[package]
name = "quake-capi"
version = "0.1.0"
description = "cbindgen-exported C ABI shims; builds the libquake_rs staticlib"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "quake_rs"
# rlib in addition to staticlib so quake-ctest can link the shims into its
# differential test binaries
crate-type = ["staticlib", "rlib"]
# no unit tests here (differential tests live in quake-ctest, which supplies
# the engine-symbol stubs); a test harness for this crate would fail to link
# on MSVC, where the staticlib's unresolved engine imports are not stripped
test = false
doctest = false

[dependencies]
quake-util = { path = "../quake-util" }
quake-math = { path = "../quake-math" }
quake-fs = { path = "../quake-fs" }
quake-image = { path = "../quake-image" }
quake-formats = { path = "../quake-formats" }
quake-types = { path = "../quake-types" }
quake-snd = { path = "../quake-snd" }
quake-net = { path = "../quake-net" }
quake-c-sys = { path = "../quake-c-sys" }
quake-platform = { path = "../quake-platform" }

[target.'cfg(unix)'.dependencies]
# Phase 5 M7b (ADR-003): errno constants for the UDP landriver shims
libc = "0.2"

[features]
# forwarded to the pure crates; set by the Meson build when the C engine is
# compiled with -D_DEBUG (see quake-math's engine-debug)
engine-debug = ["quake-math/engine-debug", "quake-net/engine-debug"]
# installs the #[global_allocator] bound to the engine's vendored mimalloc
# (ADR-013). Set only by the Meson build: plain cargo test binaries don't
# link mem.o, so the mi_* symbols don't exist there.
engine-alloc = []
# the Phase 2 filesystem shims (COM_*/FS_*/LOC_*/Steam discovery); set by
# Meson when -Duse_rust_fs is enabled, and by quake-ctest for the
# differential suites
fs = []
# the Phase 3 PCX/LMP image-decoder shims (Image_DecodePCX/Image_DecodeLMP);
# set by Meson when -Duse_rust_image is enabled, and by quake-ctest for the
# differential suites
image = []
# the Phase 3 brush/BSP loader shims (Mod_* seam from model_parse.h); set by
# Meson when -Duse_rust_formats is enabled, and by quake-ctest for the
# differential suites
formats = []
# the Phase 4 sound-engine shims; set by Meson when -Duse_rust_snd is
# enabled, and by quake-ctest for the differential suites
snd = []
# the Phase 5 networking wire-layer shims (MSG_*/SZ_*, drivers, demo IO); set
# by Meson when -Duse_rust_net is enabled, and by quake-ctest for the
# differential suites
net = []
# codec-availability flags mirroring the C build's USE_CODEC_* defines; the
# Rust codec registry (ADR-014) registers exactly the wrappers Meson links
codec-wave = []
codec-umx = []
codec-mp3 = []
codec-flac = []
codec-vorbis = []
codec-opus = []
# tracks the C build's USE_SDL3 (folder-picker dialog availability; with
# snd, also selects the quake-platform SDL3 audio backend per ADR-017)
sdl3 = ["quake-platform/sdl3"]
# tracks the C build's DO_USERDIRS (extra per-user localization lookups)
userdirs = []

[lints]
workspace = true
