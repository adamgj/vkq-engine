[package]
name = "quake-image"
version = "0.1.0"
description = "image decode/encode orchestration (ADR-012)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ADR-003/ADR-012 (M8): PNG decode behind the pixel-exact-vs-stb gate.
# "MIT OR Apache-2.0" -> MIT; first third-party runtime dependency shipped in
# libquake_rs.a (review notes in the ADR-003 M8 amendment).
png = "0.18.1"
# ADR-003/ADR-012 (M8): JPEG decode under the owner-relaxed gate
# (accept/reject + dims parity + bounded pixel delta vs stb; not bit-exact).
# "MIT OR Apache-2.0 OR Zlib" -> MIT; sole transitive dep is zune-core.
zune-jpeg = "0.5.15"

[lints]
workspace = true
