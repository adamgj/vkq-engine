name: Rust CI

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths: *ci-paths
  schedule:
    - cron: '17 6 * * 1' # weekly: surface new RustSec advisories without commits

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: fmt + clippy + deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: clippy, rustfmt
    - name: cargo fmt
      working-directory: rust
      run: cargo fmt --check
    - name: cargo clippy
      working-directory: rust
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: cargo deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        manifest-path: rust/Cargo.toml
    # the fuzz crate is its own workspace (own lockfile), so the main deny
    # run never sees libfuzzer-sys & co; check it against the same policy
    - name: cargo deny (fuzz workspace)
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        manifest-path: rust/fuzz/Cargo.toml
        arguments: --config rust/deny.toml
        command: check licenses

  # cargo-deny's advisories check already covers RustSec on every PR; this
  # standalone audit only adds value on the weekly cron
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - uses: actions/checkout@v6
    - uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: rust

  bindgen-smoke:
    name: core headers bindgen smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        # bindgen runs rustfmt over its output; without it the regen diff
        # below compares unformatted against formatted output
        components: rustfmt
    - name: Install bindgen
      # version-pinned: the committed quake-c-sys bindings embed the bindgen
      # version, so a floating install would fail the regen diff below
      run: cargo install bindgen-cli --locked --version 0.72.1
    - name: Check core headers (standalone compile + bindgen)
      run: ./scripts/harness/check_headers.sh
    - name: Regenerate quake-c-sys bindings and diff (ADR-011)
      run: |
        ./scripts/gen_c_bindings.sh
        git diff --exit-code rust/quake-c-sys/src/generated.rs

  # Phase 2 exit criterion (pak/wad/kpf inputs) plus the Phase 3 M7
  # differential targets over the quake-formats/quake-image parsers. Short
  # libFuzzer smoke on every PR/push; the weekly cron (the same event gate
  # the audit job uses) runs each target longer — 12 targets x 300s is a
  # deliberate ~60min weekly soak, bounded by timeout-minutes below.
  fuzz-smoke:
    name: fuzz smoke (fs + formats + image + sound parsers)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6
    # nightly: cargo-fuzz builds with -Zsanitizer; the rust/ toolchain file
    # pins 1.97.1, so every cargo-fuzz call below selects +nightly explicitly
    - uses: dtolnay/rust-toolchain@nightly
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked
    - name: Fuzz each target
      working-directory: rust
      env:
        # 45s per target on PR/push; 300s on the weekly cron
        MAX_TOTAL_TIME: ${{ github.event_name == 'schedule' && 300 || 45 }}
      run: |
        for t in fuzz_pak fuzz_wad fuzz_kpf fuzz_loc fuzz_vdf \
                 fuzz_pcx fuzz_lmp fuzz_bsp fuzz_mdl fuzz_spr fuzz_md3 fuzz_md5 \
                 fuzz_tga fuzz_image_stb fuzz_wav fuzz_mp3tag fuzz_net_msg; do
          mkdir -p "fuzz/corpus/$t"
          cargo +nightly fuzz run "$t" "fuzz/corpus/$t" "fuzz/corpus-seed/$t" -- \
            -max_total_time="$MAX_TOTAL_TIME" -rss_limit_mb=4096
        done
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-artifacts
        path: rust/fuzz/artifacts/
        if-no-files-found: ignore

  # differential tests (Rust ports vs original C via quake-ctest) and unit
  # tests, on every CI OS; release so proptest runs at full speed
  test:
    name: unit + differential tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    # the c_ref oracle sources must export only c_ref_* symbols: a missed
    # rename collides with the Rust definition, and ld64/rust-lld dead-strip
    # the evidence so only MSVC would notice (see the script's header)
    # (nm + ELF/Mach-O .o files; the MSVC leg produces .obj and has no nm.
    # One platform is enough -- the symbol set it checks is not OS-specific,
    # and it is precisely the Windows-only failure it exists to pre-empt)
    - name: quake-ctest oracle symbol gate
      if: matrix.os == 'ubuntu-latest'
      run: ./scripts/harness/check_ctest_symbols.sh
    - name: cargo test
      working-directory: rust
      run: cargo test --workspace --locked --release
    # debug-profile run so debug_assert! canaries fire (e.g. the hash_map
    # storage-alignment canary guarding the ADR-013 global allocator)
    - name: cargo test (debug, canaries)
      if: matrix.os == 'ubuntu-latest'
      working-directory: rust
      run: cargo test --workspace --locked
    - name: snprintf sweep smoke (2^24 stride sample)
      working-directory: rust
      run: cargo run -p quake-ctest --release --locked --bin snprintf_sweep

  # ADR-005: scheduled exhaustive conformance sweep of all 2^32 f32 patterns
  # against the platform snprintf, per CI OS
  conformance-exhaustive:
    name: exhaustive f32 formatter sweep
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Exhaustive sweep
      working-directory: rust
      run: cargo run -p quake-ctest --release --locked --bin snprintf_sweep -- --exhaustive
