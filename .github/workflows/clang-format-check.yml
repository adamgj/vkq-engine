name: Formatting check
on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/clang-format-check.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - check: 'Quake'
          - check: 'Shaders'
    steps:
    - uses: actions/checkout@v6
    - uses: DoozyX/clang-format-lint-action@v0.18
      with:
        source: ${{ matrix.path['check'] }}
        extensions: 'h,c,cpp'
        clangFormatVersion: 18
