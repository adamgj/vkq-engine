name: Windows CI (mingw)

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-mingw.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mingw:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows (mingw64),  os: windows-latest, shell: 'msys2 {0}', msystem: mingw64, msys-env: mingw-w64-x86_64, makefile: Makefile.w64 }

    steps:
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.platform.msystem }}
        install: base-devel
          ${{ matrix.platform.msys-env }}-gcc
          ${{ matrix.platform.msys-env }}-glslang

    - uses: actions/checkout@v6

    - name: Build MinGW
      run: |
        set -eu
        parallel="$(getconf _NPROCESSORS_ONLN)"
        make -j"${parallel}" -C Quake -f ${{ matrix.platform.makefile }} all
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine archive (${{ matrix.platform.name }})
        path: |
            Quake/*.exe
            Quake/*.dll
