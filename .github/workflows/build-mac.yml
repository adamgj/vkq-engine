name: macOS CI

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-mac.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mac-os:
    name: Build macOS
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]
        use-sdl3: ['auto', 'disabled']
        # no use_rust axis here: the harness job below builds both C-only and
        # mixed and diffs them, so a rust axis here would be duplicate work
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl2 sdl3 libvorbis flac opus opusfile flac mpg123 meson
    - name: Build vkqr-engine
      run: meson setup build --buildtype=${{ matrix.configuration }} -Ddebug=true -Dstrip=false -Duse_sdl3=${{ matrix.use-sdl3 }} -Duse_rust=disabled && ninja -C build
    - name: Extract debug information and bundle it to .dSYM
      run: |
        dsymutil build/vkqr-engine -o build/vkqr-engine.dSYM
        du -sh build/vkqr-engine build/vkqr-engine.dSYM
        dwarfdump --uuid build/vkqr-engine build/vkqr-engine.dSYM
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine archive (${{ matrix.configuration }}${{ matrix.use-sdl3 == 'disabled' && ', SDL2' || '' }})
        path: |
          build/vkqr-engine
          build/vkqr-engine.dSYM

  harness-mac:
    name: Harness macOS (shareware)
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl3 libvorbis flac opus opusfile mpg123 meson lhasa cbindgen
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    # three configs: C-only, mixed with the Rust fs, mixed with the C fs
    # (Phase 2 exit criterion: harness green under both -Duse_rust_fs settings)
    - name: Build C-only and mixed
      run: |
        meson setup build-c -Duse_rust=disabled && ninja -C build-c
        meson setup build-rs -Duse_rust=enabled && ninja -C build-rs
        meson setup build-rs-cfs -Duse_rust=enabled -Duse_rust_fs=disabled && ninja -C build-rs-cfs
        meson setup build-rs-csnd -Duse_rust=enabled -Duse_rust_snd=disabled && ninja -C build-rs-csnd
    - name: FFI signature parity (quake_rs.h vs engine headers)
      run: |
        ./scripts/harness/check_capi_signatures.sh build-rs/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cfs/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-csnd/quake_rs.h
    # the corpus covers the map entries too, so the per-frame hash gate sees
    # real server/edict state and not just demo playback
    - name: Golden check (shareware tier, darwin-arm64)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --check --tier shareware
    # Phase 4: the committed *.snd / *.snd-demo.hash goldens. --compare (the
    # Linux legs) only shows C and Rust agree with each other; --check pins the
    # absolute mixer output against the recorded darwin-arm64 oracle, so a
    # change that shifts both sides identically still trips. This is the only
    # job with those goldens, so it is the only place they can be validated.
    - name: Golden check (shareware tier, darwin-arm64, -sndhash)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --check --sndhash --tier shareware
    - name: Mixed build identity (rust fs vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs/vkqr-engine --tier shareware
    - name: Mixed build identity (C fs vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs-cfs/vkqr-engine --tier shareware
    # macOS is the platform whose users actually get the CoreAudio path, so
    # mirror the Linux sound-oracle legs here rather than leaving
    # -Duse_rust_snd=disabled Linux-only
    - name: Mixed build identity (C sound vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs-csnd/vkqr-engine --tier shareware
    - name: Sound PCM-hash identity (mixed vs C sound, -sndhash)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --compare build-rs-csnd/vkqr-engine --sndhash --tier shareware
    - name: Savegame byte-diff (C-only vs mixed)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/save_diff.py --vkquake build-c/vkqr-engine --vkquake-b build-rs/vkqr-engine
        python3 scripts/harness/save_diff.py --vkquake build-c/vkqr-engine --vkquake-b build-rs-cfs/vkqr-engine
