name: macOS CI

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-mac.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mac-os:
    name: Build macOS
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]
        use-sdl3: ['auto', 'disabled']
        # one engine configuration since the Phase 9 deletion PR; the harness
        # job below gates it against the committed goldens
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl2 sdl3 libvorbis flac opus opusfile flac mpg123 meson cbindgen
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Build vkqr-engine
      run: meson setup build --buildtype=${{ matrix.configuration }} -Ddebug=true -Dstrip=false -Duse_sdl3=${{ matrix.use-sdl3 }} && ninja -C build
    - name: Extract debug information and bundle it to .dSYM
      run: |
        dsymutil build/vkqr-engine -o build/vkqr-engine.dSYM
        du -sh build/vkqr-engine build/vkqr-engine.dSYM
        dwarfdump --uuid build/vkqr-engine build/vkqr-engine.dSYM
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine archive (${{ matrix.configuration }}${{ matrix.use-sdl3 == 'disabled' && ', SDL2' || '' }})
        path: |
          build/vkqr-engine
          build/vkqr-engine.dSYM

  harness-mac:
    name: Harness macOS (shareware)
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl3 libvorbis flac opus opusfile mpg123 meson lhasa cbindgen
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    # Phase 9 deletion PR: one engine configuration (the C-only oracle is tag
    # c-reference/final, ADR-019). Release is what the goldens were recorded
    # from; the debug build runs the stability gate only, since FP results
    # may differ by optimization level (ADR-010) and debug builds are never
    # compared against the goldens.
    - name: Build (release and debug)
      run: |
        meson setup build-rs && ninja -C build-rs
        meson setup build-rs-debug --buildtype=debug && ninja -C build-rs-debug
    - name: FFI signature parity (quake_rs.h vs engine headers)
      run: ./scripts/harness/check_capi_signatures.sh build-rs/quake_rs.h
    # the corpus covers the map entries too, so the per-frame hash gate sees
    # real server/edict state and not just demo playback
    - name: Golden check (shareware tier, darwin-arm64)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --check --tier shareware
    # Phase 4: the committed *.snd / *.snd-demo.hash goldens pin the absolute
    # mixer output against the recorded darwin-arm64 oracle, so a change that
    # shifts the whole chain still trips. This is the only job with those
    # goldens, so it is the only place they can be validated.
    - name: Golden check (shareware tier, darwin-arm64, -sndhash)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --check --sndhash --tier shareware
    # --stability also covers the registered-tier entries CI has no goldens
    # for on this platform
    - name: Corpus stability (release, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --stability --tier shareware
    - name: Corpus stability (debug, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs-debug/vkqr-engine --stability --tier shareware
    # Phase 7 M10.5 (ADR-019 gate 1): the classic particle simulator's active
    # list. It stays OUT of the default state-hash chain -- folding it in
    # would change every committed golden on every platform -- so it rides an
    # opt-in engine flag and is gated on run-twice stability, which needs no
    # goldens.
    - name: Particle-sim hash stability (-parthash, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --stability --extra-args=-parthash --tier shareware
    # Phase 8 M1 probe (task plan RA2): does this runner have a Metal device
    # MoltenVK can drive? One windowed run of the smallest render-corpus
    # entry; non-fatal, its outcome decides whether the SSIM gate can run
    # here or stays a locally recorded gate (Phase 7 goldens precedent).
    - name: Vulkan device probe (render corpus, non-fatal)
      continue-on-error: true
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/render_corpus.py --vkquake build-rs/vkqr-engine --stability --runs 1 --entry start-map --timeout 300 --out render-probe
    # ADR-019 gate 4 byte differs in single-build (self) mode: savegame,
    # console dump (console.c's ring geometry plus keys.c's `bindlist`) and
    # config (Key_WriteBindings and Cvar_WriteVariables through the ADR-005
    # formatter). Each parses its own output and fails on a missing or
    # malformed surface.
    - name: Savegame byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/save_diff.py --vkquake build-rs/vkqr-engine
    - name: Console dump byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/condump_diff.py --vkquake build-rs/vkqr-engine
    - name: Config byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/config_diff.py --vkquake build-rs/vkqr-engine
