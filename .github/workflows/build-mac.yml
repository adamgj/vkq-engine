name: macOS CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-mac-os:
    name: Build macOS
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]
        use-sdl3: ['auto', 'disabled']
        # no use_rust axis here: the harness job below builds both C-only and
        # mixed and diffs them, so a rust axis here would be duplicate work
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl2 sdl3 libvorbis flac opus opusfile flac mpg123 meson
    - name: Build vkQuake
      run: meson setup build --buildtype=${{ matrix.configuration }} -Ddebug=true -Dstrip=false -Duse_sdl3=${{ matrix.use-sdl3 }} -Duse_rust=disabled && ninja -C build
    - name: Extract debug information and bundle it to .dSYM
      run: |
        dsymutil build/vkquake -o build/vkquake.dSYM
        du -sh build/vkquake build/vkquake.dSYM
        dwarfdump --uuid build/vkquake build/vkquake.dSYM
    - name: Upload vkQuake
      uses: actions/upload-artifact@v7
      with:
        name: vkQuake archive (${{ matrix.configuration }}${{ matrix.use-sdl3 == 'disabled' && ', SDL2' || '' }})
        path: |
          build/vkquake
          build/vkquake.dSYM

  harness-mac:
    name: Harness macOS (shareware)
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl3 libvorbis flac opus opusfile mpg123 meson lhasa
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    - name: Build C-only and mixed
      run: |
        meson setup build-c -Duse_rust=disabled && ninja -C build-c
        meson setup build-rs -Duse_rust=enabled && ninja -C build-rs
    - name: Demo hash stability (C-only, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        for d in demo1 demo2 demo3; do
          python3 scripts/harness/run_demo.py --vkquake build-c/vkquake --demo $d --out c_${d}_1.hash
          python3 scripts/harness/run_demo.py --vkquake build-c/vkquake --demo $d --out c_${d}_2.hash
          cmp c_${d}_1.hash c_${d}_2.hash
        done
    - name: Mixed build identity (rust vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        for d in demo1 demo2 demo3; do
          python3 scripts/harness/run_demo.py --vkquake build-rs/vkquake --demo $d --out rs_${d}.hash
          cmp c_${d}_1.hash rs_${d}.hash
        done
    - name: Savegame byte-diff (C-only vs mixed)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/save_diff.py --vkquake build-c/vkquake --vkquake-b build-rs/vkquake
    - name: Golden check (shareware tier, darwin-arm64)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkquake --check --tier shareware
