name: Windows CI (meson)

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows-meson:
    name: Build Windows (meson)
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        buildtype: [release, debug]
        # one engine configuration since the Phase 9 deletion PR; the harness
        # job below gates it against the committed goldens
    steps:
    - uses: actions/checkout@v6
    - name: Determine version
      id: version
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $version = $env:GITHUB_REF_NAME
        } else {
          $version = $env:GITHUB_SHA.Substring(0, 8)
        }
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.6.0
      with:
        vulkan_version: 1.4.341.1
        install_runtime: false
        cache: true
        stripdown: true
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install meson
      run: pip install meson ninja
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        targets: x86_64-pc-windows-msvc
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Configure
      run: |
        $env:CC = 'clang-cl'
        meson setup builddir --buildtype=${{ matrix.buildtype }} -Ddebug=true -Dstrip=false -Duse_sdl3=enabled
    - name: Build
      run: meson compile -C builddir
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine meson (${{ matrix.buildtype }}, x64)
        path: |
            builddir/vkqr-engine.exe
            builddir/*.dll
            builddir/*.pdb
    - name: Package
      if: matrix.buildtype == 'release'
      run: |
        $version = '${{ steps.version.outputs.version }}'
        $srcdir = 'builddir'
        $compress = @{
          Path = "$srcdir\*.exe", "$srcdir\vkqr-engine.pdb", "$srcdir\*.dll", 'LICENSE.txt'
          CompressionLevel = 'Optimal'
          DestinationPath = "Packaging\Windows\vkqr-engine-${version}_windows_x64.zip"
        }
        Compress-Archive @compress
        choco install nsis -y --no-progress
        Set-Location Packaging\Windows
        & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V4 '-DSRCDIR=..\..\builddir' '-DPLATFORM=windows_x64' "-DVERSION=$version" vkqr-engine.nsi
        if (-not $?) { throw "makensis failed" }
    - name: Upload package
      if: matrix.buildtype == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine package (x64)
        path: |
            Packaging\Windows\vkqr-engine-*.zip
            Packaging\Windows\vkqr-engine-Installer-*.exe
    - name: Attach to release
      if: matrix.buildtype == 'release' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: |
          Packaging/Windows/vkqr-engine-*.zip
          Packaging/Windows/vkqr-engine-Installer-*.exe

  harness-windows:
    name: Harness Windows (shareware)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.6.0
      with:
        vulkan_version: 1.4.341.1
        install_runtime: false
        cache: true
        stripdown: true
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install meson
      run: pip install meson ninja
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        targets: x86_64-pc-windows-msvc
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python scripts/harness/fetch_shareware.py shareware-data
    # Phase 9 deletion PR: one engine configuration (the C-only oracle is tag
    # c-reference/final, ADR-019). Release is what the goldens were recorded
    # from; the debug build runs the stability gate only, since FP results
    # may differ by optimization level (ADR-010) and debug builds are never
    # compared against the goldens.
    - name: Build (release and debug)
      run: |
        $env:CC = 'clang-cl'
        meson setup build-rs -Duse_sdl3=enabled
        meson compile -C build-rs
        meson setup build-rs-debug -Duse_sdl3=enabled --buildtype=debug
        meson compile -C build-rs-debug
    - name: FFI signature parity (quake_rs.h vs engine headers)
      shell: bash
      env:
        CC: clang-cl
      run: ./scripts/harness/check_capi_signatures.sh build-rs/quake_rs.h
    # windows-x86_64 goldens landed in Phase 7 M11 (MSVC cl, C-only release
    # build; clang-cl was verified to reproduce them byte-identically) and the
    # three registered-tier entries were regenerated from c-reference/final at
    # the Phase 9 deletion PR, see goldens/windows-x86_64/MANIFEST.json.
    # --check is the absolute gate; --stability stays because it also covers
    # the registered-tier entries CI has no data for. All of these cover the
    # map entries, i.e. real server/edict state rather than demo playback
    # alone.
    - name: Corpus stability (release, run-twice)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine.exe --stability --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "corpus stability failed" }
    - name: Corpus stability (debug, run-twice)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-rs-debug/vkqr-engine.exe --stability --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "corpus stability (debug) failed" }
    # Phase 7 M10.5 (ADR-019 gate 1): the classic particle simulator's active
    # list. It stays OUT of the default state-hash chain -- folding it in
    # would change every committed golden on every platform -- so it rides an
    # opt-in engine flag and is gated on run-twice stability, which needs no
    # goldens.
    - name: Particle-sim hash stability (-parthash, run-twice)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine.exe --stability --extra-args=-parthash --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "corpus stability under -parthash failed" }
    # Phase 8 M1 probe (task plan RA2): does this runner expose a Vulkan
    # device at all? One windowed run of the smallest render-corpus entry;
    # non-fatal, its outcome decides whether the SSIM gate can run here or
    # stays a locally recorded gate (Phase 7 goldens precedent).
    - name: Vulkan device probe (render corpus, non-fatal)
      continue-on-error: true
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/render_corpus.py --vkquake build-rs/vkqr-engine.exe --stability --runs 1 --entry start-map --timeout 300 --out render-probe
        if ($LASTEXITCODE -ne 0) { throw "no usable Vulkan device on this runner" }
    - name: Corpus goldens (--check, plain and -sndhash)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine.exe --check --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "engine differs from windows-x86_64 goldens" }
        python scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine.exe --check --sndhash --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "engine differs from windows-x86_64 sound goldens" }
    # ADR-019 gate 4 byte differs in single-build (self) mode: savegame,
    # console dump (console.c's ring geometry plus keys.c's `bindlist`) and
    # config (Key_WriteBindings and Cvar_WriteVariables through the ADR-005
    # formatter). Each parses its own output and fails on a missing or
    # malformed surface.
    - name: Savegame byte-diff (self)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/save_diff.py --vkquake build-rs/vkqr-engine.exe
        if ($LASTEXITCODE -ne 0) { throw "save diff failed" }
    - name: Console dump byte-diff (self)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/condump_diff.py --vkquake build-rs/vkqr-engine.exe
        if ($LASTEXITCODE -ne 0) { throw "condump diff failed" }
    - name: Config byte-diff (self)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/config_diff.py --vkquake build-rs/vkqr-engine.exe
        if ($LASTEXITCODE -ne 0) { throw "config diff failed" }
    # Phase 9 M2: the Windows UDP runtime leg the net_wins.c flip was gated
    # on -- client x server interop over the Rust Winsock landriver
    # (localhost IPv4; the IPv6 landriver on MSVC/clang-cl is the Phase 10
    # M9 flip). R/R is the only build combo left; the script keeps its
    # two-build interface, so both sides name the same binary.
    - name: Interop matrix (client x server, protocol cells)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/interop_matrix.py --combos R/R --vkquake-c build-rs/vkqr-engine.exe --vkquake-rs build-rs/vkqr-engine.exe
        if ($LASTEXITCODE -ne 0) { throw "interop matrix failed" }
