name: Windows CI (meson)

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows-meson:
    name: Build Windows (meson)
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        buildtype: [release, debug]
        # no use_rust axis here: the harness job below builds both C-only and
        # mixed and diffs them, so a rust axis here would be duplicate work
    steps:
    - uses: actions/checkout@v6
    - name: Determine version
      id: version
      run: |
        if ($env:GITHUB_REF -like 'refs/tags/*') {
          $version = $env:GITHUB_REF_NAME
        } else {
          $version = $env:GITHUB_SHA.Substring(0, 8)
        }
        "version=$version" >> $env:GITHUB_OUTPUT
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.6.0
      with:
        vulkan_version: 1.4.341.1
        install_runtime: false
        cache: true
        stripdown: true
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install meson
      run: pip install meson ninja
    - name: Configure
      run: |
        $env:CC = 'clang-cl'
        meson setup builddir --buildtype=${{ matrix.buildtype }} -Ddebug=true -Dstrip=false -Duse_sdl3=enabled -Duse_rust=disabled
    - name: Build
      run: meson compile -C builddir
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine meson (${{ matrix.buildtype }}, x64)
        path: |
            builddir/vkqr-engine.exe
            builddir/*.dll
            builddir/*.pdb
    - name: Package
      if: matrix.buildtype == 'release'
      run: |
        $version = '${{ steps.version.outputs.version }}'
        $srcdir = 'builddir'
        $compress = @{
          Path = "$srcdir\*.exe", "$srcdir\vkqr-engine.pdb", "$srcdir\*.dll", 'LICENSE.txt'
          CompressionLevel = 'Optimal'
          DestinationPath = "Packaging\Windows\vkqr-engine-${version}_windows_x64.zip"
        }
        Compress-Archive @compress
        choco install nsis -y --no-progress
        Set-Location Packaging\Windows
        & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V4 '-DSRCDIR=..\..\builddir' '-DPLATFORM=windows_x64' "-DVERSION=$version" vkqr-engine.nsi
        if (-not $?) { throw "makensis failed" }
    - name: Upload package
      if: matrix.buildtype == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine package (x64)
        path: |
            Packaging\Windows\vkqr-engine-*.zip
            Packaging\Windows\vkqr-engine-Installer-*.exe
    - name: Attach to release
      if: matrix.buildtype == 'release' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: |
          Packaging/Windows/vkqr-engine-*.zip
          Packaging/Windows/vkqr-engine-Installer-*.exe

  harness-windows:
    name: Harness Windows (shareware)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1.6.0
      with:
        vulkan_version: 1.4.341.1
        install_runtime: false
        cache: true
        stripdown: true
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Install meson
      run: pip install meson ninja
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        targets: x86_64-pc-windows-msvc
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python scripts/harness/fetch_shareware.py shareware-data
    # three configs: C-only, mixed with the Rust fs, mixed with the C fs
    # (Phase 2 exit criterion: harness green under both -Duse_rust_fs settings)
    - name: Build C-only and mixed
      run: |
        $env:CC = 'clang-cl'
        meson setup build-c -Duse_sdl3=enabled -Duse_rust=disabled
        meson compile -C build-c
        meson setup build-rs -Duse_sdl3=enabled -Duse_rust=enabled
        meson compile -C build-rs
        meson setup build-rs-cfs -Duse_sdl3=enabled -Duse_rust=enabled -Duse_rust_fs=disabled
        meson compile -C build-rs-cfs
    - name: FFI signature parity (quake_rs.h vs engine headers)
      shell: bash
      env:
        CC: clang-cl
      run: |
        ./scripts/harness/check_capi_signatures.sh build-rs/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cfs/quake_rs.h
    # no windows-x86_64 goldens yet, so gate on run-to-run stability and on the
    # mixed build matching C-only; both cover the map entries, i.e. real
    # server/edict state rather than demo playback alone
    - name: Corpus stability (C-only, run-twice)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine.exe --stability --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "corpus stability failed" }
    - name: Mixed build identity (rust fs vs C-only)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine.exe --compare build-rs/vkqr-engine.exe --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "mixed build differs from C-only" }
    - name: Mixed build identity (C fs vs C-only)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine.exe --compare build-rs-cfs/vkqr-engine.exe --tier shareware
        if ($LASTEXITCODE -ne 0) { throw "mixed build (C fs) differs from C-only" }
    - name: Savegame byte-diff (C-only vs mixed)
      run: |
        $env:QUAKE_GAME_DATA = "$PWD\shareware-data"
        python scripts/harness/save_diff.py --vkquake build-c/vkqr-engine.exe --vkquake-b build-rs/vkqr-engine.exe
        if ($LASTEXITCODE -ne 0) { throw "save diff failed" }
        python scripts/harness/save_diff.py --vkquake build-c/vkqr-engine.exe --vkquake-b build-rs-cfs/vkqr-engine.exe
        if ($LASTEXITCODE -ne 0) { throw "save diff (C fs) failed" }
