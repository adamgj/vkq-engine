name: Linux CI

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths: *ci-paths
  # golden generation (ADR-019 rebuild recipe) is manual: it builds the C
  # oracle at tag c-reference/final; the regular jobs do not run on dispatch
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the generated linux-x86_64 goldens to the dispatched branch (otherwise only upload them)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Determine version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: Packaging/AppImage/docker
        platforms: linux/amd64
        tags: build-vkqr-engine
        load: true
        push: false
        cache-from: type=gha
        cache-to: type=gha
    - name: Build vkqr-engine
      run: docker run --rm --privileged -e VERSION=${{ steps.version.outputs.version }} -v "$PWD:/usr/src/vkqr-engine" build-vkqr-engine /usr/src/vkqr-engine/Packaging/AppImage/run-in-docker.sh
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine AppImage
        path: Packaging/AppImage/vkqr-engine-*.AppImage
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: Packaging/AppImage/vkqr-engine-*.AppImage

  # Rust-migration differential harness on the one engine configuration (the
  # C-only oracle is tag c-reference/final since the Phase 9 deletion PR;
  # the generate-goldens-linux dispatch job below rebuilds it for goldens)
  harness-linux:
    name: Harness Linux (shareware)
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'
    env:
      VULKAN_SDK_VER: 1.4.341.1
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build libsdl2-dev \
          libvorbis-dev libflac-dev libopus-dev libopusfile-dev libmpg123-dev lhasa \
          mesa-vulkan-drivers xvfb
    - name: Cache Vulkan SDK tools
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: vulkan-sdk
        key: vulkan-sdk-${{ env.VULKAN_SDK_VER }}-linux-x86_64
    # distro glslang/spirv-tools/vulkan headers are too old for meson.build's
    # --canonicalize-ids and >=1.4.341 checks; take the same SDK subset the
    # AppImage docker image uses
    - name: Install Vulkan SDK tools
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        wget -q -O vulkan-sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VER}.tar.xz"
        mkdir -p vulkan-sdk
        tar -xf vulkan-sdk.tar.xz -C vulkan-sdk --strip-components=1 --wildcards \
          "${VULKAN_SDK_VER}/x86_64/bin/glslang" \
          "${VULKAN_SDK_VER}/x86_64/bin/glslangValidator" \
          "${VULKAN_SDK_VER}/x86_64/bin/spirv-opt" \
          "${VULKAN_SDK_VER}/x86_64/include" \
          "${VULKAN_SDK_VER}/x86_64/lib/libvulkan.so*"
        rm vulkan-sdk.tar.xz
    - name: Export Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$PWD/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/vulkan-sdk/x86_64/lib" >> "$GITHUB_ENV"
        echo "$PWD/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    # Phase 9 deletion PR: there is no C-only configuration any more -- the
    # oracle is tag c-reference/final (ADR-019) -- so this job builds the one
    # engine configuration for SDL2 plus its -Dtrace=true twin and gates on
    # the committed goldens, run-to-run stability and the single-build byte
    # differs. Every C-vs-mixed --compare leg went with the C oracle.
    - name: Build (SDL2 release, and the -Dtrace=true twin)
      run: |
        meson setup build-rs -Duse_sdl3=disabled && ninja -C build-rs
        meson setup build-rs-trace -Duse_sdl3=disabled -Dtrace=true && ninja -C build-rs-trace
    - name: FFI signature parity (quake_rs.h vs engine headers)
      run: ./scripts/harness/check_capi_signatures.sh build-rs/quake_rs.h
    # linux-x86_64 goldens come from the generate-goldens-linux dispatch job
    # below (the C oracle at c-reference/final; run 35460948153 committed
    # the shareware set). All of these cover the map entries, i.e. real
    # server/edict state rather than demo playback alone.
    - name: Golden check (shareware tier, linux-x86_64, plain and -sndhash)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --check --tier shareware
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --check --sndhash --tier shareware
    - name: Corpus stability (run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --stability --tier shareware
    # Phase 7 M10.5 (ADR-019 gate 1): the classic particle simulator's active
    # list. It stays OUT of the default state-hash chain -- folding it in
    # would change every committed golden on every platform -- so it rides an
    # opt-in engine flag and is gated on run-twice stability, which needs no
    # goldens.
    - name: Particle-sim hash stability (-parthash, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --stability --extra-args=-parthash --tier shareware
    # Phase 4 (ADR-019 sound PCM-hash): the mixer runs on the deterministic
    # harness DMA clock under -sndhash; the per-frame paintbuffer+DMA chain
    # must be bit-identical run to run (and, once the linux goldens land,
    # against the recorded oracle chain above)
    - name: Sound PCM-hash stability (-sndhash, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --stability --sndhash --tier shareware
    # Phase 6 (ADR-019 gate 3): instruction-level trace stability. Demo
    # playback never starts a server and so emits zero records -- the
    # scenarios are maps, and trace_diff.py's record floor enforces that.
    # e1m1/e1m2/start are the shareware maps the corpus already proves are
    # present; the wider map set and the mission-pack gamedirs are
    # registered-tier and run locally.
    - name: Progs trace stability (run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        for m in e1m1 e1m2 start; do
          python3 scripts/harness/trace_diff.py --vkquake build-rs-trace/vkqr-engine \
            --vkquake-b build-rs-trace/vkqr-engine --map "$m" --exitafter 400
        done
    # ADR-019 gate 4, the byte differs in their single-build (self) mode: the
    # savegame, the console dump (console.c's ring geometry plus keys.c's
    # `bindlist`), the config (Key_WriteBindings and Cvar_WriteVariables
    # through the ADR-005 formatter), the deterministic loopback session
    # recorded to a .dem, and the captured-session replay (state-hash chains
    # plus the demo recorded during the replay). Each parses its own output
    # and fails on a missing or malformed surface.
    - name: Savegame byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/save_diff.py --vkquake build-rs/vkqr-engine
    - name: Console dump byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/condump_diff.py --vkquake build-rs/vkqr-engine
    - name: Config byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/config_diff.py --vkquake build-rs/vkqr-engine
    - name: Demo record byte-diff (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/record_diff.py --vkquake build-rs/vkqr-engine
    - name: Captured-session replay byte gate (self)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/capture_session.py --vkquake build-rs/vkqr-engine --out session-rs.cap --frames 1200
        python3 scripts/harness/netreplay_diff.py --capture session-rs.cap --vkquake build-rs/vkqr-engine
    # Phase 5 M8: client x server interop across the negotiable protocol
    # cells (localhost IPv4; the IPv6 leg is local-only per the task plan).
    # R/R is the only build combo left; the script keeps its two-build
    # interface, so both sides name the same binary.
    - name: Interop matrix (client x server, protocol cells)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/interop_matrix.py --combos R/R \
          --vkquake-c build-rs/vkqr-engine --vkquake-rs build-rs/vkqr-engine
    # Phase 7 M1 T1.3: the netplay-soak gate at its CI (smoke) frame budget;
    # the full-length 100k-frame runs are local-only since CI cannot attest
    # an hours-long run. Criterion is liveness + traffic profile, never hash
    # identity: see the script's "Why this gate is not hash-exact".
    #
    # 5000 frames, not the 20000 the M1 evidence run used: the sessions are
    # paced to real time (both processes run the sys_ticrate loop), so 20000
    # frames is ~4.5 min per process run, while both engine bugs this gate
    # was built to catch surfaced by ~frame 128. 20000 stays the
    # local/milestone budget.
    - name: Netplay soak smoke (R/R, 5k server frames, both protocols)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/interop_matrix.py --soak --frames 5000 --combos R/R \
          --vkquake-c build-rs/vkqr-engine --vkquake-rs build-rs/vkqr-engine
    # Phase 3 M6: gl_model.c fans model loading out over task workers and the
    # Rust loaders run on those workers, so changing the worker count must not
    # perturb the simulation. -pinnedworkers overrides the count.
    #
    # Scope, precisely: the harness state hash covers edicts, qcvm globals and
    # client entity state (Quake/harness.c) -- nothing produced by the skin
    # load tasks enters it. So this catches a loader that Sys_Errors,
    # deadlocks, or corrupts state the simulation reads; it does NOT gate
    # those task bodies' own output for order independence. Decoder-level
    # order independence is covered by the threaded_parse ctest.
    - name: Worker count does not perturb the simulation (1 vs 8)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine \
          --compare build-rs/vkqr-engine --tier shareware \
          --extra-args "-pinnedworkers 0" \
          --compare-extra-args "-pinnedworkers 0,1,2,3,4,5,6,7"
    # Phase 3 T1 physics matrix, same-build self-compare (post-deletion plan
    # D10 amendment): every sv_gameplayfix_elevators / recursivehullcheck /
    # smoothplatformlerps cell must be run-to-run stable on the Rust build.
    # The C-vs-Rust compare retired with the oracle.
    - name: Physics matrix (self-compare, all cells)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/physics_matrix.py --vkquake-a build-rs/vkqr-engine
    # Phase 3 M7 (D9 / AC4-7): drive every model/image asset of the shareware
    # id1 through the frozen C loaders (rust/quake-ctest/csrc, the text of
    # c-reference/final) and the Rust ports in-process and assert bit-for-bit
    # parity of the parsed structs, console log, and upload payloads. Any
    # divergence aborts the binary, failing this step; the emitted manifest is
    # uploaded for cross-run/platform diffing. This is the only real-asset
    # BSP/MDL/SPR/image parity gate: the state-hash goldens do not hash parsed
    # geometry.
    - name: Formats corpus gate (frozen C vs Rust, shareware)
      run: |
        python3 scripts/harness/run_formats_corpus.py           --game-data "$PWD/shareware-data" --gamedir id1           --out formats-corpus-linux-x86_64.txt
        # belt-and-braces vacuous-pass floor: grep -c exits 1 on zero OK lines
        grep -c '^OK ' formats-corpus-linux-x86_64.txt
        tail -1 formats-corpus-linux-x86_64.txt
    - name: Formats corpus gate (frozen C vs Rust, in-repo vq_pak images)
      # the three real PNGs under Misc/vq_pak (two of them baked into the
      # embedded vkquake.pak and decoded on every engine launch) run through
      # both Image_DecodeSTB implementations bit-for-bit on every CI run (the
      # shareware tier has no PNG/TGA/JPG; the full-depot image corpus is a
      # dev-host gate)
      run: |
        python3 scripts/harness/run_formats_corpus.py           --game-data "$PWD/Misc" --gamedir vq_pak           --out formats-corpus-vq-pak.txt
        # pinned: all three PNGs must produce a parity-verified OK line, so a
        # rename or skip cannot silently thin the leg out (update the count
        # here and the comment above when a PNG is added to Misc/vq_pak)
        test "$(grep -c '^OK .*\.png' formats-corpus-vq-pak.txt)" -eq 3
        tail -1 formats-corpus-vq-pak.txt
    - name: Upload formats manifest
      uses: actions/upload-artifact@v4
      with:
        name: formats-corpus-linux
        path: formats-corpus-*.txt
    # Phase 8 M1 (ADR-015 / ADR-019): the windowed render harness, on lavapipe
    # (mesa-vulkan-drivers) under xvfb. Run-to-run stability: the -renderhash
    # chains (cull decisions + draw-call structure) must be identical run to
    # run and the screenshot SSIM must clear the entry threshold; this is also
    # what sets the per-platform SSIM floor. The validation layer is not in the
    # SDK subset installed above, so --validation is a local (Windows) gate.
    - name: Render corpus stability (lavapipe, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        xvfb-run -a -s "-screen 0 1280x1024x24" python3 scripts/harness/render_corpus.py --vkquake build-rs/vkqr-engine --stability --runs 2 --timeout 1200 --out render-out
    - name: Upload render corpus report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: render-corpus-linux
        path: |
          render-out/report.json
          render-out/*/*/stdout*.txt
        if-no-files-found: ignore

  # ADR-013 / PLAN §7 gate 9: AddressSanitizer on the C side of the mixed
  # build, catching cross-language allocator misuse (alloc on one heap, free
  # on the other) at the Mem_* boundary. Rust code is not instrumented; the
  # shared mimalloc and every C call site are.
  asan-harness:
    name: ASan mixed build (shareware smoke)
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'
    env:
      VULKAN_SDK_VER: 1.4.341.1
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build libsdl2-dev \
          libvorbis-dev libflac-dev libopus-dev libopusfile-dev libmpg123-dev lhasa
    - name: Cache Vulkan SDK tools
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: vulkan-sdk
        key: vulkan-sdk-${{ env.VULKAN_SDK_VER }}-linux-x86_64
    - name: Install Vulkan SDK tools
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        wget -q -O vulkan-sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VER}.tar.xz"
        mkdir -p vulkan-sdk
        tar -xf vulkan-sdk.tar.xz -C vulkan-sdk --strip-components=1 --wildcards \
          "${VULKAN_SDK_VER}/x86_64/bin/glslang" \
          "${VULKAN_SDK_VER}/x86_64/bin/glslangValidator" \
          "${VULKAN_SDK_VER}/x86_64/bin/spirv-opt" \
          "${VULKAN_SDK_VER}/x86_64/include" \
          "${VULKAN_SDK_VER}/x86_64/lib/libvulkan.so*"
        rm vulkan-sdk.tar.xz
    - name: Export Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$PWD/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/vulkan-sdk/x86_64/lib" >> "$GITHUB_ENV"
        echo "$PWD/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    - name: Build mixed with ASan
      run: |
        meson setup build-asan -Duse_sdl3=disabled -Db_sanitize=address
        ninja -C build-asan
    - name: Demo smoke under ASan
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        # exit-time leaks are pre-existing engine behavior, not boundary bugs
        export ASAN_OPTIONS=detect_leaks=0
        python3 scripts/harness/run_demo.py --vkquake build-asan/vkqr-engine --demo demo1 --out asan-demo1.hash
    # Phase 3 M6 / AC8: a map load reaches the alias and MD5/MD3 skin task
    # dispatches (gl_model.c:1997, :2205) that demo playback alone barely
    # exercises, and the forced eight-worker run makes the fan-out real on a
    # small CI runner. Both go through the Rust loaders.
    - name: Map load under ASan, forced multi-worker
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        export ASAN_OPTIONS=detect_leaks=0
        printf '0 map e1m2\n900 quit\n' > asan-map.cmds
        python3 scripts/harness/run_demo.py --vkquake build-asan/vkqr-engine \
          --cmds asan-map.cmds --exitafter 1000 --out asan-map.hash \
          --extra-args "-pinnedworkers 0,1,2,3,4,5,6,7"

  # Phase 9 deletion PR (ADR-019 amendment, 2026-09-19): the linux-x86_64
  # goldens are generated from the C oracle at tag c-reference/final, never
  # from the mixed build -- there is no C build in the tree any more, so the
  # oracle is rebuilt from the tag in a side worktree. Manual dispatch only;
  # the set is uploaded as an artifact and, with commit=true, committed to the
  # dispatched branch. The MANIFEST pins the runner image and toolchain so a
  # later mismatch can be told apart from an engine change (ADR-010: goldens
  # are per platform and per toolchain).
  generate-goldens-linux:
    name: Generate linux-x86_64 goldens (C oracle at c-reference/final)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VULKAN_SDK_VER: 1.4.341.1
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build libsdl2-dev \
          libvorbis-dev libflac-dev libopus-dev libopusfile-dev libmpg123-dev lhasa
    - name: Cache Vulkan SDK tools
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: vulkan-sdk
        key: vulkan-sdk-${{ env.VULKAN_SDK_VER }}-linux-x86_64
    - name: Install Vulkan SDK tools
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        wget -q -O vulkan-sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VER}.tar.xz"
        mkdir -p vulkan-sdk
        tar -xf vulkan-sdk.tar.xz -C vulkan-sdk --strip-components=1 --wildcards \
          "${VULKAN_SDK_VER}/x86_64/bin/glslang" \
          "${VULKAN_SDK_VER}/x86_64/bin/glslangValidator" \
          "${VULKAN_SDK_VER}/x86_64/bin/spirv-opt" \
          "${VULKAN_SDK_VER}/x86_64/include" \
          "${VULKAN_SDK_VER}/x86_64/lib/libvulkan.so*"
        rm vulkan-sdk.tar.xz
    - name: Export Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$PWD/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/vulkan-sdk/x86_64/lib" >> "$GITHUB_ENV"
        echo "$PWD/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    # the tag's tree still carries -Duse_rust; disabled = the pure C oracle
    # (no cargo/cbindgen needed). SDL2, matching the harness-linux build.
    - name: Build the C oracle at c-reference/final
      run: |
        git worktree add ../cref c-reference/final
        cd ../cref
        meson setup build-c -Duse_sdl3=disabled -Duse_rust=disabled --buildtype=release
        ninja -C build-c
    # run_corpus.py writes next to itself, so this tree's copy puts the set
    # under this tree's Misc/harness/goldens/linux-x86_64/; the --check after
    # proves the just-written set reproduces
    - name: Generate goldens (shareware tier, state-hash and --sndhash chains)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake ../cref/build-c/vkqr-engine --generate --tier shareware
        python3 scripts/harness/run_corpus.py --vkquake ../cref/build-c/vkqr-engine --generate --sndhash --tier shareware
        python3 scripts/harness/run_corpus.py --vkquake ../cref/build-c/vkqr-engine --check --tier shareware
        python3 scripts/harness/run_corpus.py --vkquake ../cref/build-c/vkqr-engine --check --sndhash --tier shareware
    - name: Write MANIFEST.json
      run: |
        python3 - <<'EOF'
        import datetime, json, os, subprocess
        sh = lambda *a: subprocess.check_output(a, text=True).strip()
        m = {
          "platform": "linux-x86_64",
          "generated_from_commit": sh("git", "rev-parse", "--short", "c-reference/final^{commit}") + " (tag c-reference/final)",
          "generated_date": datetime.date.today().isoformat(),
          "generated_by_workflow_run": os.environ.get("GITHUB_RUN_ID", ""),
          "build": {
            "buildtype": "release",
            "compiler": sh("cc", "--version").splitlines()[0],
            "sdl": "SDL2 " + sh("pkg-config", "--modversion", "sdl2"),
            "runner_image": os.environ.get("ImageOS", "") + " " + os.environ.get("ImageVersion", ""),
            "use_rust": "disabled",
          },
          "notes": [
            "Generated by the generate-goldens-linux workflow_dispatch job in .github/workflows/build-linux.yml from a C-only release build of tag c-reference/final (the last C-capable commit), per the ADR-019 rebuild recipe. The mixed build never generates goldens.",
            "Coverage is the shareware tier only (the runner has no registered, mission-pack or mod data); run_corpus.py --check skips the other entries without failing.",
            "corpus.json pins a sha256 on each entry's required data, and entry_available hard-skips on mismatch, so these goldens are tied to exactly the 1.06 pak0 that fetch_shareware.py produces.",
            "Goldens are derived per-frame FNV-1a state hashes, not game data; the .snd files are the deterministic-DMA mixer PCM chains (--sndhash).",
            "Generated from release builds only; debug builds run the stability gate but are not compared against these (FP results may differ by optimization level, ADR-010). The ADR-010 same-platform rule stands: never compare these against a non-Linux build, and re-dispatch this job if the runner image's compiler or SDL2 changes and --check starts failing on every entry at once.",
            "The headless RNG stream intentionally differs from a windowed run, so these only ever compare headless runs against headless runs.",
            "Never hand-edit. Regenerate by re-dispatching this job.",
          ],
        }
        with open("Misc/harness/goldens/linux-x86_64/MANIFEST.json", "w") as f:
          json.dump(m, f, indent=2)
          f.write("\n")
        EOF
        cat Misc/harness/goldens/linux-x86_64/MANIFEST.json
    - name: Upload goldens
      uses: actions/upload-artifact@v4
      with:
        name: goldens-linux-x86_64
        path: Misc/harness/goldens/linux-x86_64/
        if-no-files-found: error
    - name: Commit goldens to the dispatched branch
      if: ${{ inputs.commit }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Misc/harness/goldens/linux-x86_64
        git commit -m "Add linux-x86_64 harness goldens from c-reference/final (ADR-019)"
        git push
