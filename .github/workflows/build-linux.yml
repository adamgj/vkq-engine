name: Linux CI

on:
  push:
    branches: [master]
    tags: ['*'] # path filters are not evaluated for tag pushes, so releases always build
    paths: &ci-paths
      - '**'
      # non-functional files: docs, editor/tooling config
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - '!.vscode/**'
      - '!.gitignore'
      - '!LICENSE.txt'
      - '!vs-chromium-project.txt'
      - '!helgrind.supp'
      - '!.github/ISSUE_TEMPLATE/**'
      # another workflow's change can't affect this one; this file's can
      - '!.github/workflows/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths: *ci-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Determine version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: Packaging/AppImage/docker
        platforms: linux/amd64
        tags: build-vkqr-engine
        load: true
        push: false
        cache-from: type=gha
        cache-to: type=gha
    - name: Build vkqr-engine
      run: docker run --rm --privileged -e VERSION=${{ steps.version.outputs.version }} -v "$PWD:/usr/src/vkqr-engine" build-vkqr-engine /usr/src/vkqr-engine/Packaging/AppImage/run-in-docker.sh
    - name: Upload vkqr-engine
      uses: actions/upload-artifact@v7
      with:
        name: vkqr-engine AppImage
        path: Packaging/AppImage/vkqr-engine-*.AppImage
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: Packaging/AppImage/vkqr-engine-*.AppImage

  # Rust-migration mixed build + differential harness (the AppImage job above
  # stays C-only; its docker image has no Rust toolchain)
  harness-linux:
    name: Harness Linux (shareware)
    runs-on: ubuntu-24.04
    env:
      VULKAN_SDK_VER: 1.4.341.1
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build libsdl2-dev \
          libvorbis-dev libflac-dev libopus-dev libopusfile-dev libmpg123-dev lhasa
    - name: Cache Vulkan SDK tools
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: vulkan-sdk
        key: vulkan-sdk-${{ env.VULKAN_SDK_VER }}-linux-x86_64
    # distro glslang/spirv-tools/vulkan headers are too old for meson.build's
    # --canonicalize-ids and >=1.4.341 checks; take the same SDK subset the
    # AppImage docker image uses
    - name: Install Vulkan SDK tools
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        wget -q -O vulkan-sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VER}.tar.xz"
        mkdir -p vulkan-sdk
        tar -xf vulkan-sdk.tar.xz -C vulkan-sdk --strip-components=1 --wildcards \
          "${VULKAN_SDK_VER}/x86_64/bin/glslang" \
          "${VULKAN_SDK_VER}/x86_64/bin/glslangValidator" \
          "${VULKAN_SDK_VER}/x86_64/bin/spirv-opt" \
          "${VULKAN_SDK_VER}/x86_64/include" \
          "${VULKAN_SDK_VER}/x86_64/lib/libvulkan.so*"
        rm vulkan-sdk.tar.xz
    - name: Export Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$PWD/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/vulkan-sdk/x86_64/lib" >> "$GITHUB_ENV"
        echo "$PWD/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    # C-only, fully mixed, and each per-module switch in its "keep the C"
    # position: those legs are the only thing that keeps the C fallback
    # compiling and linking as modules are ported (Phase 2/3 exit criterion)
    - name: Build C-only and mixed
      run: |
        meson setup build-c -Duse_sdl3=disabled -Duse_rust=disabled && ninja -C build-c
        meson setup build-rs -Duse_sdl3=disabled -Duse_rust=enabled && ninja -C build-rs
        meson setup build-rs-cfs -Duse_sdl3=disabled -Duse_rust=enabled -Duse_rust_fs=disabled && ninja -C build-rs-cfs
        meson setup build-rs-cimg -Duse_sdl3=disabled -Duse_rust=enabled -Duse_rust_image=disabled && ninja -C build-rs-cimg
        meson setup build-rs-cfmt -Duse_sdl3=disabled -Duse_rust=enabled -Duse_rust_formats=disabled && ninja -C build-rs-cfmt
        meson setup build-rs-csnd -Duse_sdl3=disabled -Duse_rust=enabled -Duse_rust_snd=disabled && ninja -C build-rs-csnd
        meson setup build-rs-cnet -Duse_sdl3=disabled -Duse_rust=enabled -Duse_rust_net=disabled && ninja -C build-rs-cnet
        meson setup build-rs-cprogs -Duse_sdl3=disabled -Duse_rust=enabled -Duse_rust_progs=disabled && ninja -C build-rs-cprogs
        # ADR-019 gate 3 needs a -Dtrace=true pair; the Rust half joins at
        # Phase 6 M3, when the interpreter first executes progs code
        meson setup build-c-trace -Duse_sdl3=disabled -Duse_rust=disabled -Dtrace=true && ninja -C build-c-trace
    - name: FFI signature parity (quake_rs.h vs engine headers)
      run: |
        ./scripts/harness/check_capi_signatures.sh build-rs/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cfs/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cimg/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cfmt/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-csnd/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cnet/quake_rs.h
        ./scripts/harness/check_capi_signatures.sh build-rs-cprogs/quake_rs.h
    # no linux-x86_64 goldens yet, so gate on run-to-run stability and on the
    # mixed build matching C-only; both cover the map entries, i.e. real
    # server/edict state rather than demo playback alone
    - name: Corpus stability (C-only, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --stability --tier shareware
    - name: Mixed build identity (rust fs vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs/vkqr-engine --tier shareware
    - name: Mixed build identity (C fs vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs-cfs/vkqr-engine --tier shareware
    - name: Mixed build identity (C sound vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs-csnd/vkqr-engine --tier shareware
    - name: Mixed build identity (C net vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs-cnet/vkqr-engine --tier shareware
    - name: Mixed build identity (C progs vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs-cprogs/vkqr-engine --tier shareware
    # Phase 6 (ADR-019 gate 3): the progs-VM instruction trace. Demo playback
    # never starts a server and so emits zero records -- the oracle scenarios
    # are maps, and trace_diff.py's record floor enforces that. Until M3 flips
    # the interpreter this is a producer-stability gate (same build twice).
    - name: Progs trace stability (C-only, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/trace_diff.py --vkquake build-c-trace/vkqr-engine \
          --vkquake-b build-c-trace/vkqr-engine --map e1m1 --exitafter 300
    # Phase 4 (ADR-019 sound PCM-hash): the mixer runs on the deterministic
    # harness DMA clock under -sndhash; the per-frame paintbuffer+DMA chain
    # must be bit-identical between the Rust sound engine and the C original
    - name: Sound PCM-hash identity (mixed vs C sound, -sndhash)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine --compare build-rs-csnd/vkqr-engine --sndhash --tier shareware
    - name: Sound PCM-hash identity (C-only vs mixed, -sndhash)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-c/vkqr-engine --compare build-rs/vkqr-engine --sndhash --tier shareware
    - name: Savegame byte-diff (C-only vs mixed)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/save_diff.py --vkquake build-c/vkqr-engine --vkquake-b build-rs/vkqr-engine
        python3 scripts/harness/save_diff.py --vkquake build-c/vkqr-engine --vkquake-b build-rs-cfs/vkqr-engine
        python3 scripts/harness/save_diff.py --vkquake build-c/vkqr-engine --vkquake-b build-rs-cnet/vkqr-engine
    # Phase 5 (ADR-019 gate 4): -netcapture smoke over a live localhost
    # session on the C build, then the structural differ in self-compare mode
    # (parser sanity). Cross-build capture comparisons begin at the M5/M7
    # driver flips; the byte gates are the netreplay/record_diff instruments.
    - name: Net capture gate (C x2 for the noise floor, then C vs Rust)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/capture_session.py --vkquake build-c/vkqr-engine --out session-c.cap --frames 1200
        python3 scripts/harness/capture_session.py --vkquake build-c/vkqr-engine --out session-c2.cap --frames 1200
        python3 scripts/harness/capture_session.py --vkquake build-rs/vkqr-engine --out session-rs.cap --frames 1200
        python3 scripts/harness/capture_diff.py session-c.cap session-rs.cap --window-from session-c2.cap -v
    # Phase 5 M4 (ADR-019 gate 4): deterministic loopback session recorded by
    # both builds must produce byte-identical .dem files
    - name: Demo record byte-diff (C self, then C vs Rust)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/record_diff.py --vkquake build-c/vkqr-engine
        python3 scripts/harness/record_diff.py --vkquake build-c/vkqr-engine --vkquake-b build-rs/vkqr-engine
    # Phase 5 M8 (ADR-019 gate 4): the timing-noise-free byte gate -- replay
    # the captured session on both builds; state-hash chains and the demo
    # recorded during the replay must be byte-identical
    - name: Captured-session replay byte gate (C self, then C vs Rust)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/netreplay_diff.py --capture session-c.cap --vkquake build-c/vkqr-engine
        python3 scripts/harness/netreplay_diff.py --capture session-c.cap --vkquake build-c/vkqr-engine --vkquake-b build-rs/vkqr-engine
    # Phase 5 M8: 4-way C/Rust interop across the negotiable protocol cells
    # (localhost IPv4; the IPv6 leg is local-only per the task plan)
    - name: Interop matrix (C/Rust client x server, protocol cells)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/interop_matrix.py --vkquake-c build-c/vkqr-engine --vkquake-rs build-rs/vkqr-engine
    # Phase 3 M6: gl_model.c fans model loading out over task workers and the
    # Rust loaders run on those workers, so changing the worker count must not
    # perturb the simulation. -pinnedworkers overrides the count (tasks.c:366).
    #
    # Scope, precisely: the harness state hash covers edicts, qcvm globals and
    # client entity state (Quake/harness.c:159-233) -- nothing produced by
    # Mod_LoadSkinTask/Mod_LoadMDXSkinTask enters it. So this catches a loader
    # that Sys_Errors, deadlocks, or corrupts state the simulation reads; it
    # does NOT gate those two task bodies' own output for order independence.
    # Decoder-level order independence is covered by the threaded_parse ctest.
    - name: Worker count does not perturb the simulation (1 vs 8, mixed build)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/run_corpus.py --vkquake build-rs/vkqr-engine \
          --compare build-rs/vkqr-engine --tier shareware \
          --extra-args "-pinnedworkers 0" \
          --compare-extra-args "-pinnedworkers 0,1,2,3,4,5,6,7"
    # Phase 3 M7 (D9 / AC4-7): drive every model/image asset of the shareware
    # id1 through both the c_ref C loaders and the Rust ports in-process and
    # assert bit-for-bit parity of the parsed structs, console log, and
    # upload payloads. Any divergence aborts the binary, failing this step;
    # the emitted manifest is uploaded for cross-run/platform diffing.
    - name: Formats corpus gate (C vs Rust, shareware)
      run: |
        python3 scripts/harness/run_formats_corpus.py \
          --game-data "$PWD/shareware-data" --gamedir id1 \
          --out formats-corpus-linux-x86_64.txt
        # belt-and-braces vacuous-pass floor: grep -c exits 1 on zero OK lines
        grep -c '^OK ' formats-corpus-linux-x86_64.txt
        tail -1 formats-corpus-linux-x86_64.txt
    - name: Formats corpus gate (C vs Rust, in-repo vq_pak images)
      # M8: the three real PNGs under Misc/vq_pak (two of them baked into the
      # embedded vkquake.pak and decoded on every engine launch) run through
      # both Image_DecodeSTB implementations bit-for-bit on every CI run —
      # the standing real-PNG leg of AC11 (the shareware tier has no
      # PNG/TGA/JPG; the full-depot image corpus is a dev-host gate)
      run: |
        python3 scripts/harness/run_formats_corpus.py \
          --game-data "$PWD/Misc" --gamedir vq_pak \
          --out formats-corpus-vq-pak.txt
        # pinned: all three PNGs must produce a parity-verified OK line, so a
        # rename or skip cannot silently thin the leg out (update the count
        # here and the comment above when a PNG is added to Misc/vq_pak)
        test "$(grep -c '^OK .*\.png' formats-corpus-vq-pak.txt)" -eq 3
        tail -1 formats-corpus-vq-pak.txt
    - name: Upload formats manifest
      uses: actions/upload-artifact@v4
      with:
        name: formats-corpus-manifest
        path: |
          formats-corpus-linux-x86_64.txt
          formats-corpus-vq-pak.txt
        # the manifest is always written on success; its absence is an error
        if-no-files-found: error

  # ADR-013 / PLAN §7 gate 9: AddressSanitizer on the C side of the mixed
  # build, catching cross-language allocator misuse (alloc on one heap, free
  # on the other) at the Mem_* boundary. Rust code is not instrumented; the
  # shared mimalloc and every C call site are.
  asan-harness:
    name: ASan mixed build (shareware smoke)
    runs-on: ubuntu-24.04
    env:
      VULKAN_SDK_VER: 1.4.341.1
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build libsdl2-dev \
          libvorbis-dev libflac-dev libopus-dev libopusfile-dev libmpg123-dev lhasa
    - name: Cache Vulkan SDK tools
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: vulkan-sdk
        key: vulkan-sdk-${{ env.VULKAN_SDK_VER }}-linux-x86_64
    - name: Install Vulkan SDK tools
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        wget -q -O vulkan-sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VER}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VER}.tar.xz"
        mkdir -p vulkan-sdk
        tar -xf vulkan-sdk.tar.xz -C vulkan-sdk --strip-components=1 --wildcards \
          "${VULKAN_SDK_VER}/x86_64/bin/glslang" \
          "${VULKAN_SDK_VER}/x86_64/bin/glslangValidator" \
          "${VULKAN_SDK_VER}/x86_64/bin/spirv-opt" \
          "${VULKAN_SDK_VER}/x86_64/include" \
          "${VULKAN_SDK_VER}/x86_64/lib/libvulkan.so*"
        rm vulkan-sdk.tar.xz
    - name: Export Vulkan SDK environment
      run: |
        echo "VULKAN_SDK=$PWD/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/vulkan-sdk/x86_64/lib" >> "$GITHUB_ENV"
        echo "$PWD/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Install cbindgen
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    - name: Build mixed with ASan
      run: |
        meson setup build-asan -Duse_sdl3=disabled -Duse_rust=enabled -Db_sanitize=address
        ninja -C build-asan
    - name: Demo smoke under ASan
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        # exit-time leaks are pre-existing engine behavior, not boundary bugs
        export ASAN_OPTIONS=detect_leaks=0
        python3 scripts/harness/run_demo.py --vkquake build-asan/vkqr-engine --demo demo1 --out asan-demo1.hash
    # Phase 3 M6 / AC8: a map load reaches the alias and MD5/MD3 skin task
    # dispatches (gl_model.c:1997, :2205) that demo playback alone barely
    # exercises, and the forced eight-worker run makes the fan-out real on a
    # small CI runner. Both go through the Rust loaders (use_rust_formats and
    # use_rust_image follow use_rust to `auto` -> on).
    - name: Map load under ASan, forced multi-worker
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        export ASAN_OPTIONS=detect_leaks=0
        printf '0 map e1m2\n900 quit\n' > asan-map.cmds
        python3 scripts/harness/run_demo.py --vkquake build-asan/vkqr-engine \
          --cmds asan-map.cmds --exitafter 1000 --out asan-map.hash \
          --extra-args "-pinnedworkers 0,1,2,3,4,5,6,7"
