name: Linux CI

on: [push, pull_request]

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Determine version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: Packaging/AppImage/docker
        platforms: linux/amd64
        tags: build-vkquake
        load: true
        push: false
        cache-from: type=gha
        cache-to: type=gha
    - name: Build vkQuake
      run: docker run --rm --privileged -e VERSION=${{ steps.version.outputs.version }} -v "$PWD:/usr/src/vkQuake" build-vkquake /usr/src/vkQuake/Packaging/AppImage/run-in-docker.sh
    - name: Upload vkQuake
      uses: actions/upload-artifact@v7
      with:
        name: vkQuake AppImage
        path: Packaging/AppImage/vkQuake-*.AppImage
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: Packaging/AppImage/vkQuake-*.AppImage

  # Rust-migration mixed build + differential harness (the AppImage job above
  # stays C-only; its docker image has no Rust toolchain)
  harness-linux:
    name: Harness Linux (shareware)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build glslang-tools spirv-tools libsdl2-dev libvulkan-dev \
          libvorbis-dev libflac-dev libopus-dev libopusfile-dev libmpg123-dev lhasa
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
    - name: Cache shareware data
      uses: actions/cache@v4
      with:
        path: shareware-data
        key: quake106-shareware-v1
    - name: Fetch shareware data
      run: python3 scripts/harness/fetch_shareware.py shareware-data
    - name: Build C-only and mixed
      run: |
        meson setup build-c -Duse_sdl3=disabled -Duse_rust=disabled && ninja -C build-c
        meson setup build-rs -Duse_sdl3=disabled -Duse_rust=enabled && ninja -C build-rs
    - name: Demo hash stability (C-only, run-twice)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        for d in demo1 demo2 demo3; do
          python3 scripts/harness/run_demo.py --vkquake build-c/vkquake --demo $d --out c_${d}_1.hash
          python3 scripts/harness/run_demo.py --vkquake build-c/vkquake --demo $d --out c_${d}_2.hash
          cmp c_${d}_1.hash c_${d}_2.hash
        done
    - name: Mixed build identity (rust vs C-only)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        for d in demo1 demo2 demo3; do
          python3 scripts/harness/run_demo.py --vkquake build-rs/vkquake --demo $d --out rs_${d}.hash
          cmp c_${d}_1.hash rs_${d}.hash
        done
    - name: Savegame byte-diff (C-only vs mixed)
      run: |
        export QUAKE_GAME_DATA="$PWD/shareware-data"
        python3 scripts/harness/save_diff.py --vkquake build-c/vkquake --vkquake-b build-rs/vkquake
